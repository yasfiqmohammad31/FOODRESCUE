<script>
        // Simple countdown logic
        document.addEventListener('DOMContentLoaded', () => {
            const circle = document.getElementById('progress-circle');
            const radius = circle.r.baseVal.value;
            const circumference = radius * 2 * Math.PI;
            
            circle.style.strokeDasharray = `${circumference} ${circumference}`;
            circle.style.strokeDashoffset = 0;

            const countdownText = document.getElementById('countdown-text');
            let timeLeft = 60;
            const totalTime = 60;

            const setProgress = (percent) => {
                const offset = circumference - percent / 100 * circumference;
                circle.style.strokeDashoffset = offset;
            }

            const interval = setInterval(() => {
                timeLeft--;
                countdownText.textContent = `${timeLeft}s`;
                
                const percentage = (timeLeft / totalTime) * 100;
                setProgress(percentage);

                // Change color as it gets closer
                if(timeLeft < 15) {
                    circle.classList.remove('text-error');
                    circle.classList.add('text-[#8d0048]'); // Tertiary color for urgency
                }

                if (timeLeft <= 0) {
                    clearInterval(interval);
                    countdownText.textContent = "0s";
                    // Transition to next screen logic would go here
                }
            }, 1000);
        });
    </script>
